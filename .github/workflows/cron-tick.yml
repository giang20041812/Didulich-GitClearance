name: cron-tick

# Hobby của Vercel chỉ cho cron 1 lần/ngày, nên gọi /api/internal/cron/tick từ GitHub Actions (tối thiểu 5 phút/lần, có thể trễ vài phút).
# Cần 2 secret của repo: API_BASE_URL (vd https://didulich-api.vercel.app) và CRON_SECRET (trùng với env của backend).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi cron tick
        run: |
          curl -fsS --retry 2 --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.API_BASE_URL }}/api/internal/cron/tick"
